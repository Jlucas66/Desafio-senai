spring:
  application:
    name: passe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/passe}
    username: ${DB_USER:passe}
    password: ${DB_PASSWORD:passe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /docs/openapi.json

logging:
  level:
    org.springframework.web.servlet.PageNotFound: ERROR
