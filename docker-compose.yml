services:
  db:
    image: postgres:16
    container_name: passe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passe}
      POSTGRES_USER: ${POSTGRES_USER:-passe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - passe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: passe-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-passe}
      DB_USER: ${POSTGRES_USER:-passe}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-passe}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: America/Sao_Paulo
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  passe-db-data: