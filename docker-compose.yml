services:
  db:
    image: postgres:16
    container_name: passe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passe}
      POSTGRES_USER: ${POSTGRES_USER:-passe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - passe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  passe-db-data: